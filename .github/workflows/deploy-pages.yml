name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec vite build
        env:
          VITE_STATIC_SITE: "true"
          # VITE_FRONTEND_FORGE_API_KEY and VITE_FRONTEND_FORGE_API_URL are
          # intentionally omitted: the interactive Google Maps feature is
          # disabled in static mode (MAPS_INTERACTIVE_ENABLED = false) and
          # those keys must never be embedded in a public artifact without a
          # server-side proxy.  The Dealers page renders a graceful text
          # fallback when the map is unavailable.

      - name: Prepare Pages artifact
        run: |
          test -f dist/public/index.html
          if [ -f CNAME ]; then
            cp CNAME dist/public/CNAME
          fi
          cp dist/public/index.html dist/public/404.html
          if [ -d dist/public/__manus__ ]; then
            rm -rf dist/public/__manus__
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
